plugins {
    id("java")
    id("application")
}

group = "com.qa"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
    maven {
        // --- START OF CHANGE: Reading Environment Variables ---

        // 1. Read the GITHUB_REPO_URL from the Jenkins Environment Variable (e.g., set by Environment Injector)
        // Fallback to project property if running locally
        def repoUrl = System.getenv('GITHUB_REPO_URL') ?: project.findProperty('githubRepoUrl')

        url = uri(repoUrl as String)

        credentials {
            // 2. Read Username/Password from Jenkins Environment Variables
            //    (assuming you named them GITHUB_USERNAME and GITHUB_PASSWORD)
            username = System.getenv('GITHUB_USERNAME') ?: project.findProperty('githubUsername') as String
            password = System.getenv('GITHUB_PASSWORD') ?: project.findProperty('githubPassword') as String
        }
        // --- END OF CHANGE: Reading Environment Variables ---
    }
}

dependencies {
    // --- Framework and Core Dependencies (using 'implementation') ---
    implementation("org.seleniumhq.selenium:selenium-java:4.22.0")
    implementation("com.qa:ta-automation:0.1.5")

    implementation("org.testng:testng:7.10.2")
    implementation("com.aventstack:extentreports:5.1.1")

}

tasks.test {
    // This section is fine as it uses the '-PsuiteXml' property, which is usually non-sensitive
    // If you wanted to make 'suiteXml' an environment variable (e.g., SUITE_XML), you'd
    // update this section similarly, but keeping it as a project property is clean.
    if (project.hasProperty('suiteXml')) {
        useTestNG() {
            suites(project.getProperty('suiteXml'))

            options {
                outputDirectory = file("${buildDir}/test-reports")
            }
        }
    } else {
        // Fallback for running locally without a property
        useTestNG() {
            suites("testng.xml")
        }
    }
}