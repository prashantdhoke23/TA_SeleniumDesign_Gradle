plugins {
    id("java")
    id("application")
}

group = "com.qa"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
    maven {
        url = uri(project.property("githubRepoUrl") as String)
        credentials {
            username = project.property("githubUsername") as String
            password = project.property("githubPassword") as String
        }
    }

}

dependencies {
    // --- Framework and Core Dependencies (using 'implementation') ---
    implementation("org.seleniumhq.selenium:selenium-java:4.22.0")
    implementation("com.qa:ta-automation:0.1.5")

    // CRITICAL FIX: Changed to 'implementation' so TestNG and Extent Reports
    // are on the primary classpath, ensuring the Listener and TestNG runner are found.
    implementation("org.testng:testng:7.10.2")
    implementation("com.aventstack:extentreports:5.1.1")

}

tasks.test {
    // 1. Check if an XML suite path is provided via the command line
    // 1. Check if an XML suite path is provided via the command line
    if (project.hasProperty('suiteXml')) {
        useTestNG() {
            // Use the path provided by the command line argument
            suites(project.getProperty('suiteXml'))

            // 2. Explicitly set the TestNG output directory to a common location
            options {
                outputDirectory = file("${buildDir}/test-reports")
            }
        }
    } else {
        // Fallback for running locally without a property
        useTestNG() {
            suites("testng.xml")
        }
    }
}

