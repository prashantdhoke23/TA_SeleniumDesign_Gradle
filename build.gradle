plugins {
    id("java")
    id("application")
}

group = "com.qa"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
    maven {
        // --- FIX: Use project.findProperty() to read the Jenkins-injected properties ---

        // The key is to use project.findProperty() for all variables
        def repoUrl = project.findProperty('githubRepoUrl')

        // CRITICAL: Ensure repoUrl is not null before calling uri()
        if (repoUrl == null) {
            throw new GradleException("The 'githubRepoUrl' property is missing. Please check your Jenkins 'Properties Content' configuration.")
        }

        url = uri(repoUrl as String)

        credentials {
            // Read from the injected Project Properties
            username = project.findProperty('githubUsername') as String
            password = project.findProperty('githubPassword') as String
        }
    }
}

dependencies {
    // --- Framework and Core Dependencies (using 'implementation') ---
    implementation("org.seleniumhq.selenium:selenium-java:4.22.0")
    implementation("com.qa:ta-automation:0.1.5")

    implementation("org.testng:testng:7.10.2")
    implementation("com.aventstack:extentreports:5.1.1")

}

tasks.test {
    // This section is fine as it uses the '-PsuiteXml' property, which is usually non-sensitive
    // If you wanted to make 'suiteXml' an environment variable (e.g., SUITE_XML), you'd
    // update this section similarly, but keeping it as a project property is clean.
    if (project.hasProperty('suiteXml')) {
        useTestNG() {
            suites(project.getProperty('suiteXml'))

            options {
                outputDirectory = file("${buildDir}/test-reports")
            }
        }
    } else {
        // Fallback for running locally without a property
        useTestNG() {
            suites("testng.xml")
        }
    }
}